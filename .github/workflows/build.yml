name: static checks

# ⚠️ 诚实声明：这个 workflow **不编译 HAP**。
#
# 原因：编译 HarmonyOS 工程需要 DevEco Studio 及其 HarmonyOS SDK，而 DevEco 的
# 完整发行包要求开发者账号登录后才能下载，无法在 GitHub 托管的公开 runner 上
# 匿名获取（hvigorw 与 SDK 都不在 ubuntu-latest/windows-latest 镜像里）。
#
# 所以这里只跑「无需 SDK 就能验证」的静态检查。绿色 ✓ 的含义是
# 「工程结构完整、配置可解析、没把签名材料提交进来」，
# **不代表**「HAP 能编出来」。真实编译请在本机装 DevEco Studio 后执行
# docs/BUILD.md 里的步骤。
#
# 如果你有自建 runner（已装 DevEco Studio），见文件末尾注释里的可选 job。

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: project structure and config checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: required project files exist
        run: |
          set -euo pipefail
          fail=0
          for f in hvigorfile.ts build-profile.json5 oh-package.json5 \
                   AppScope/app.json5 entry/src/main/module.json5 \
                   entry/src/main/ets/pages/Index.ets \
                   entry/src/main/ets/background/BackGroundAbility.ets \
                   entry/src/main/cpp/protocol/deskflow_client.cpp \
                   LICENSE NOTICE README.md; do
            if [ -f "$f" ]; then
              echo "OK   $f"
            else
              echo "::error title=missing file::$f"
              fail=1
            fi
          done
          exit $fail

      - name: json5 configs parse
        run: |
          set -euo pipefail
          npm i -g json5 --silent >/dev/null 2>&1
          GLOBAL_NM="$(npm root -g)"
          for f in build-profile.json5 oh-package.json5 AppScope/app.json5 entry/src/main/module.json5; do
            F="$f" GLOBAL_NM="$GLOBAL_NM" node -e '
              const fs = require("fs");
              const json5 = require(process.env.GLOBAL_NM + "/json5");
              const o = json5.parse(fs.readFileSync(process.env.F, "utf8"));
              if (!o || typeof o !== "object") {
                console.error("::error::" + process.env.F + " did not parse to an object");
                process.exit(1);
              }
              console.log("OK   " + process.env.F + "  keys=" + Object.keys(o).join(","));
            '
          done

      - name: no signing material committed
        run: |
          set -euo pipefail
          bad=$(find . -path ./.git -prune -o -type f \
                 \( -name '*.p12' -o -name '*.p7b' -o -name '*.cer' -o -name '*.jks' \) -print || true)
          if [ -n "$bad" ]; then
            echo "::error title=signing material committed::$bad"
            exit 1
          fi
          if grep -qE '"(keyPassword|storePassword)"[[:space:]]*:' build-profile.json5; then
            echo "::error title=password field in build-profile.json5::this repo must not contain signingConfigs"
            exit 1
          fi
          echo "OK   no signing material"

      - name: license intact
        run: |
          set -euo pipefail
          head -3 LICENSE | grep -qi 'GNU GENERAL PUBLIC LICENSE' \
            || { echo "::error title=LICENSE is not the GPL-2.0 text"; exit 1; }
          grep -qi 'GPL-2.0' NOTICE \
            || { echo "::error title=NOTICE lacks upstream license notice"; exit 1; }
          echo "OK   GPL-2.0 notices present"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Static checks (HAP is NOT compiled)"
            echo ""
            echo "This workflow only checks project structure, config parseability, signing-material leakage and license notices."
            echo ""
            echo "**HAP is not compiled**: the CI environment has no DevEco Studio and no HarmonyOS SDK."
            echo "See \`docs/BUILD.md\` for the real build steps."
          } >> "$GITHUB_STEP_SUMMARY"

